spring.application.name=simaqinpe

# Carrega o arquivo .env (se existir) como fonte de propriedades.
# Em producao/CI as mesmas variaveis podem vir do ambiente do sistema.
spring.config.import=optional:file:.env[.properties]

# Banco: PostgreSQL no Neon (credenciais somente por variavel de ambiente)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Gravacao em lotes (importacao)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Upload de arquivos de importacao
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
